[package]
name = "medialake-llama"
version.workspace = true
edition.workspace = true

# Apple clang has no OpenMP and macOS uses Metal instead of Vulkan.
[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-sys-2 = { version = "0.1.160", default-features = false, features = ["mtmd", "openmp"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-sys-2 = { version = "0.1.160", default-features = false, features = ["mtmd", "metal"] }

[features]
vulkan = ["llama-cpp-sys-2/vulkan"]
