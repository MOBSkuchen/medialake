edition.workspace = true

[[bin]]
name = "searchnow-server"
path = "src/main.rs"

[dependencies]
bierpc.workspace = true
bier_derive.workspace = true
searchnow-proto.workspace = true
searchnow-llama.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
