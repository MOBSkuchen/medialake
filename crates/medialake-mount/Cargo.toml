[package]
name = "medialake-mount"
version.workspace = true
edition.workspace = true

[lib]
name = "medialake_mount"

# the A0 spike (unix only): cargo run -p medialake-mount --features spike --bin mount-spike
[[bin]]
name = "mount-spike"
path = "src/bin/spike.rs"
required-features = ["spike"]

[features]
spike = []

[dependencies]
medialake-proto.workspace = true
medialake-sync.workspace = true
nfsserve = "0.11"
async-trait = "0.1"
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
