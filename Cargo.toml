[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "3.0.0"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
bierpc = { path = "../bierpc/bierpc" }
bier_derive = { path = "../bierpc/bier_derive" }
tokio = { version = "1.49", features = ["full"] }
sha2 = "0.10"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
medialake-proto = { path = "crates/medialake-proto" }
medialake-llama = { path = "crates/medialake-llama" }
medialake-core = { path = "crates/medialake-core" }
medialake-sync = { path = "crates/medialake-sync" }

# crates.io llama-cpp-sys-2 vendors a llama.cpp without the gemma-embedding2 arch; use llama-cpp-rs
# main with its llama.cpp submodule moved to b11535 (see vendor/README.md).
[patch.crates-io]
llama-cpp-sys-2 = { path = "vendor/llama-cpp-rs/llama-cpp-sys-2" }

[profile.release]
debug = "line-tables-only"
